name: Release

# Triggered by pushing a version tag, e.g.: git tag v1.0.1 && git push origin v1.0.1
# The annotated tag message (git tag -a v1.0.1 -m "...") is used as release notes.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    environment: marketplace # optional: add required reviewers to this environment for a manual approval step
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Determine version and release notes
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          mkdir -p build
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > build/release-notes.md
          if [ ! -s build/release-notes.md ]; then echo "Release $VERSION" > build/release-notes.md; fi

      - name: Build and test
        run: ./gradlew build -PPluginVersion=${{ steps.meta.outputs.version }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "server/build/distributions/aws-secretsmanager-plugin-${{ steps.meta.outputs.version }}.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes-file build/release-notes.md

      - name: Publish to JetBrains Marketplace
        env:
          JETBRAINS_MARKETPLACE_TOKEN: ${{ secrets.JETBRAINS_MARKETPLACE_TOKEN }}
        run: ./gradlew :server:publishPlugin -PPluginVersion=${{ steps.meta.outputs.version }}
